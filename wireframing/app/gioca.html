<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Away - Gioco Memory</title>
    <style>
        @font-face {
            font-family: 'Maison Neue';
            src: url('../../fonts/fonnts.com-Maison_Neue_Light.ttf') format('truetype');
            font-weight: 300;
            font-style: normal;
        }
        @font-face {
            font-family: 'Maison Neue';
            src: url('../../fonts/fonnts.com-Maison_Neue_Book.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'Maison Neue';
            src: url('../../fonts/fonnts.com-Maison_Neue_Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }
        @font-face {
            font-family: 'Maison Neue Mono';
            src: url('../../fonts/fonnts.com-Maison_Neue_Mono.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }

        :root {
            --gray-color: #E5E5E5;
            --bg-color: #ffffff;
            --text-color: #000000;
            --secondary-color: var(--gray-color);
            --border-color: #000000;
            --font-main: 'Maison Neue Mono', monospace;
            --font-display: 'Maison Neue', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            display: flex;
            justify-content: center;
        }

        #app-frame {
            width: 100%;
            max-width: 430px; /* Mobile width */
            height: 100vh;
            border-left: 2px solid var(--border-color);
            border-right: 2px solid var(--border-color);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: var(--bg-color);
        }

        /* Top Bar */
        header {
            padding: 1rem 1.5rem;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-color);
            z-index: 10;
        }

        header h1 {
            font-family: var(--font-display);
            font-size: 1.2rem;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: -0.03em;
            margin: 0;
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background-color: var(--text-color);
            color: var(--bg-color);
            text-decoration: none;
            font-weight: bold;
            border: 1px solid var(--text-color);
            cursor: pointer;
            text-align: center;
            font-family: var(--font-main);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.9rem;
            appearance: none;
            -webkit-appearance: none;
            border-radius: 0;
        }

        /* Memory Board */
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            width: 100%;
            margin: 1.5rem 0;
        }

        .memory-card {
            height: 120px;
            border: 2px solid var(--border-color);
            background-color: var(--secondary-color);
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .memory-card.flipped {
            background-color: var(--bg-color);
            border-style: solid;
        }

        .card-back {
            font-size: 2.5rem;
            font-weight: bold;
            opacity: 0.4;
        }

        .card-front {
            display: none;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
            text-align: center;
        }

        .memory-card.flipped .card-back {
            display: none;
        }

        .memory-card.flipped .card-front {
            display: block;
        }

        /* Win Overlay */
        #win-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 100;
            color: var(--bg-color);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="app-frame">
        <!-- Header -->
        <header style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <a href="mappa-islanda.html" style="color: var(--text-color); display: flex; align-items: center; text-decoration: none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 24px; height: 24px; margin-right: 0.3rem;">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                <span style="font-weight: bold; font-size: 0.75rem;">MAPPA</span>
            </a>
            <h1 style="font-size: 1rem; margin: 0;">MINIGIOCO</h1>
            <div style="font-weight: bold; display: flex; align-items: center; gap: 0.5rem; font-family: var(--font-display);">
                <span>450 PT</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 8l4 4-4 4M8 12h8"></path>
                </svg>
            </div>
        </header>

        <!-- Main Content -->
        <main>
            <div style="margin-bottom: 0.5rem; text-align: center;">
                <span style="font-size: 0.75rem; font-weight: bold; border: 1px solid var(--text-color); padding: 0.3rem 0.6rem; font-family: var(--font-display);">MEMORY VULCANICO</span>
            </div>

            <p style="text-align: center; font-size: 0.8rem; margin-bottom: 1rem;">Trova le coppie corrispondenti per sbloccare i segreti della spiaggia di Vík.</p>
            
            <!-- Grid -->
            <div class="memory-grid" id="grid">
                <!-- Cards will be injected by JS -->
            </div>

            <!-- Win Overlay -->
            <div id="win-overlay">
                <div style="border: 2px solid var(--bg-color); padding: 2rem; width: 100%; max-width: 320px;">
                    <div style="display: inline-block; padding: 0.3rem 0.6rem; background-color: var(--bg-color); color: var(--text-color); font-weight: bold; font-size: 0.75rem; margin-bottom: 1.5rem; font-family: var(--font-display);">VITTORIA!</div>
                    <h2 style="font-size: 1.6rem; margin-bottom: 1rem; font-family: var(--font-display);">Hai trovato le coppie!</h2>
                    <p style="font-size: 0.85rem; margin-bottom: 1.5rem; opacity: 0.9;">Ottima memoria. Hai sbloccato i segreti della spiaggia nera.</p>
                    
                    <div style="font-family: var(--font-display); font-weight: 900; font-size: 1.1rem; border: 2px solid var(--bg-color); padding: 0.8rem; text-align: center; margin-bottom: 2rem;">
                        +50 PUNTI
                    </div>

                    <a href="mappa-islanda.html" class="btn">TORNA ALLA MAPPA</a>
                </div>
            </div>
        </main>
    </div>

    <script>
        const cardsData = [
            { name: 'Basalto', icon: 'BASALTO' },
            { name: 'Basalto', icon: 'BASALTO' },
            { name: 'Oceano', icon: 'OCEANO' },
            { name: 'Oceano', icon: 'OCEANO' },
            { name: 'Lava', icon: 'LAVA' },
            { name: 'Lava', icon: 'LAVA' }
        ];

        // Shuffle cards
        cardsData.sort(() => 0.5 - Math.random());

        const grid = document.getElementById('grid');
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let matchedPairs = 0;

        function createBoard() {
            cardsData.forEach((data, index) => {
                const card = document.createElement('div');
                card.classList.add('memory-card');
                card.dataset.name = data.name;
                
                card.innerHTML = `
                    <span class="card-back">X</span>
                    <span class="card-front">${data.icon}</span>
                `;
                
                card.addEventListener('click', flipCard);
                grid.appendChild(card);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flipped');

            if (!hasFlippedCard) {
                // First card click
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            // Second card click
            secondCard = this;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.name === secondCard.dataset.name;
            isMatch ? disableCards() : unflipCards();
        }

        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            matchedPairs++;

            if (matchedPairs === 3) {
                setTimeout(() => {
                    document.getElementById('win-overlay').style.display = 'flex';
                }, 500);
            }

            resetBoard();
        }

        function unflipCards() {
            lockBoard = true;

            setTimeout(() => {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                resetBoard();
            }, 1000);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        // Init
        createBoard();
    </script>
</body>
</html>
